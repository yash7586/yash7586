name: Update Contribution Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate terminal contribution graph
        run: |
          mkdir -p profile

          curl -L \
            "https://github-readme-insight-terminal-asci.vercel.app/svg?user=yash7586&theme=mac" \
            -o profile/contributions.svg

      - name: Commit generated graph
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/contributions.svg

          git diff --cached --quiet || git commit -m "Update contribution graph"

          git push
