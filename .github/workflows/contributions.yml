name: Update Contribution Graph

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate contribution graph
        run: |
          mkdir -p profile

          curl -fsSL \
            "https://github-readme-insight-terminal-asci.vercel.app/svg?user=yash7586&theme=mac" \
            -o profile/contributions.svg

          echo "Contribution graph generated successfully."

      - name: Commit SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/contributions.svg

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: update contribution graph"
            git push
          fi
